[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-material-url-tester"
version = "0.1.0"
description = "Extract and check URLs in learning material files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "UTCSheffield"}]
dependencies = ["pypdf>=4.0", "playwright>=1.40", "streamlit>=1.35", "pandas>=2.0"]

[project.scripts]
learning-material-url-tester = "learning_material_url_tester.cli:main"
learning-material-url-tester-report = "learning_material_url_tester._report_launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
